[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-illegal-windows-names" },
  { id = "check-json" },
  { id = "check-toml" },
  { id = "mixed-line-ending", args = ["--fix=no"] },
  { id = "check-merge-conflict", args = ["--assume-in-merge"] },
  { id = "detect-private-key", exclude = '_test\.go$' },
  { id = "check-yaml", exclude = '^deploy/podman/grafana-configmaps\.gen\.yaml$' },
]
